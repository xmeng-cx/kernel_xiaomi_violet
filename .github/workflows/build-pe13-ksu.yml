name: Build violet PE13 (No KernelSU)

on:
  workflow_dispatch:
  push:
    branches:
      - pe13-ksu
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: violet-pe13-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/violet-perf_defconfig
  KBUILD_BUILD_USER: Edison
  KBUILD_BUILD_HOST: GitHub-Actions

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Clean Runner disk
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            unzip \
            wget \
            zip \
            zstd

          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version

      - name: Setup ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      - name: Generate kernel config
        shell: bash
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make O=out \
            ARCH=arm64 \
            "${DEFCONFIG}"

          echo "========== Kernel config =========="
          grep -E "CONFIG_KPROBES|CONFIG_MODULES|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          set -e
          set -o pipefail

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb \
            2>&1 | tee build.log

      - name: Build dtbo
        shell: bash
        run: |
          set -e
          set -o pipefail

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs \
            2>&1 | tee -a build.log

      - name: Check build result
        shell: bash
        run: |
          set -e

          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          DTBO_IMAGE="out/arch/arm64/boot/dts/xiaomi/violet-sm6150-overlay.dtbo"

          test -f "${KERNEL_IMAGE}"
          test -s "${KERNEL_IMAGE}"

          ls -lh "${KERNEL_IMAGE}"
          ls -lh "${DTBO_IMAGE}" || echo "DTBO not found, checking other locations..."
          find out/ -name "*.dtbo" -type f 2>/dev/null | head -5
          ccache --show-stats

      - name: Create AnyKernel3 zip
        shell: bash
        run: |
          set -e

          rm -rf AnyKernel3 dist

          git clone \
            --depth=1 \
            --branch sixteen \
            https://github.com/Joker-V2/AnyKernel3.git \
            AnyKernel3

          rm -f \
            AnyKernel3/Image \
            AnyKernel3/Image.gz \
            AnyKernel3/Image.gz-dtb \
            AnyKernel3/dtbo.img

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            AnyKernel3/Image.gz-dtb

          DTBO_FILE=$(find out/ -name "*violet*overlay*.dtbo" -type f | head -1)
          if [ -n "${DTBO_FILE}" ]; then
            cp "${DTBO_FILE}" AnyKernel3/dtbo.img
            echo "Copied DTBO: ${DTBO_FILE}"
          else
            echo "Warning: DTBO file not found"
          fi

          mkdir -p dist

          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          ZIP_NAME="violet-PE13-${BUILD_DATE}.zip"

          cd AnyKernel3

          zip -r9 "../dist/${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "README.md"

          cd ..

          sha256sum "dist/${ZIP_NAME}" \
            | tee "dist/${ZIP_NAME}.sha256"

          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-PE13-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: violet-build-log-${{ github.run_number }}
          path: |
            build.log
            out/.config
          if-no-files-found: ignore
          retention-days: 7
